<!-- planet -->
<path d="M-140 875C250 620 790 610 1290 900C1400 964 1520 1030 1670 1100H-140V875Z" fill="#080D16"/>
<path d="M-80 860C250 650 690 620 1070 780C1300 875 1450 990 1650 1110" stroke="url(#horizon)" stroke-width="5" filter="url(#glow)"/>
<path d="M-50 884C290 705 700 690 1120 850" stroke="#B8C8FF" stroke-opacity=".12"/>
<!-- subtle network -->
<g stroke="#7F91B8" stroke-opacity=".13" stroke-width="1">
<path d="M0 900L220 790L420 920L600 760L820 900L1000 780L1210 920"/>
<path d="M120 980L300 830L520 1010L700 850L930 1000L1100 870"/>
</g>
