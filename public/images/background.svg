<path d="M760 430C665 300 560 280 520 340C475 410 590 470 735 475C625 505 555 580 605 645C660 715 745 615 760 495"/>
<path d="M780 430C875 300 980 280 1020 340C1065 410 950 470 805 475C915 505 985 580 935 645C880 715 795 615 780 495"/>
